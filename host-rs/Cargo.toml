[workspace]
members = [
    ".",
    "crates/agenttab-host",
    "crates/agenttab-protocol",
]
default-members = [
    ".",
    "crates/agenttab-host",
    "crates/agenttab-protocol",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.0"

[workspace.dependencies]
base64 = "0.22"
chrono = "0.4"
fs2 = "0.4"
libc = "0.2"
parking_lot = "0.12"
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[package]
name = "chrome-bridge-host"
edition = "2021"
version = "0.1.0"

[[bin]]
name = "bridge-host"
path = "src/main.rs"

[dependencies]
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
socket2 = "0.5"
url = "2"
glob = "0.3"
regex = "1"
sha2 = "0.10"
