name: Review Gate

on:
  pull_request_review:
    types: [submitted]

permissions:
  checks: write
  contents: read

jobs:
  publish-exact-head-review:
    name: publish-exact-head-review
    if: ${{ github.event.review.user.login == 'copilot-pull-request-reviewer[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish exact-head review result
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.payload.pull_request?.head?.sha;
            const reviewed = context.payload.review?.commit_id;
            const exactHead = Boolean(head && reviewed && head === reviewed);
            const output = {
              title: exactHead
                ? "Automated review matches the pull-request head"
                : "Automated review is stale",
              summary: exactHead
                ? `Review commit ${reviewed} matches the current pull-request head.`
                : `Review commit ${reviewed || "missing"} does not match pull-request head ${head || "missing"}.`,
            };

            if (!head) {
              core.setFailed("The pull-request head SHA is missing from the review event.");
              return;
            }

            const existing = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: head,
              check_name: "exact-head-review",
              filter: "latest",
              per_page: 1,
            });
            const check = existing.data.check_runs[0];
            if (check) {
              await github.rest.checks.update({
                owner,
                repo,
                check_run_id: check.id,
                status: "completed",
                conclusion: exactHead ? "success" : "failure",
                completed_at: new Date().toISOString(),
                output,
              });
            } else {
              await github.rest.checks.create({
                owner,
                repo,
                name: "exact-head-review",
                head_sha: head,
                status: "completed",
                conclusion: exactHead ? "success" : "failure",
                completed_at: new Date().toISOString(),
                output,
              });
            }

            if (!exactHead) {
              core.setFailed("The automated review does not match the current pull-request head.");
            }
