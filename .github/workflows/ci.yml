name: CI

on:
  pull_request:
    branches: [main, pivot/agenttab]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      lane: ${{ steps.policy.outputs.lane }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select comparison range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            printf 'base=\nhead=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          head="$(git rev-parse "refs/remotes/pull/${PR_NUMBER}/head")"
          if [[ "$head" != "$PR_HEAD_SHA" ]]; then
            echo "pull-request head does not match event payload" >&2
            exit 1
          fi
          base="$(git merge-base "$PR_BASE_SHA" "$head")"
          {
            printf 'base=%s\n' "$base"
            printf 'head=%s\n' "$head"
          } >> "$GITHUB_OUTPUT"
      - name: Classify changes and scan public text
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            printf 'lane=full\nreason=main-push\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f .github/scripts/ci_policy.py ]]; then
            echo "::warning::CI policy is unavailable on the base revision; selecting the full lane without the public-text scan"
            printf 'lane=full\nreason=policy-unavailable\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/ci_policy.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  ci-policy:
    name: ci-policy
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test CI policy
        run: python3 .github/scripts/test_ci_policy.py

  ci:
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.lane == 'full' }}
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.M1_CI_ENABLED == 'true' && '["self-hosted","macOS","ARM64","wolfie-m1","trusted"]' || '"macos-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        if: ${{ runner.name != 'wolfie-m1-chrome-bridge' }}
        with:
          python-version: '3.11'
      - name: Use the provisioned M1 Python
        if: ${{ runner.name == 'wolfie-m1-chrome-bridge' }}
        shell: bash
        run: |
          python_root=/opt/homebrew/opt/python@3.11/libexec/bin
          "$python_root/python3" --version
          echo "$python_root" >> "$GITHUB_PATH"
          cft_binary="$(find "$HOME/Library/Caches/ms-playwright" \
            -path '*Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing' \
            -type f -print -quit)"
          test -n "$cft_binary"
          "$cft_binary" --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare persistent M1 build cache
        if: ${{ startsWith(runner.name, 'wolfie-m1') }}
        shell: bash
        run: |
          cache_root="$HOME/Library/Caches/agenttab-ci/rust-1.97"
          python3 scripts/prepare_ci_cache.py --root "$cache_root"
          echo "CARGO_TARGET_DIR=$cache_root/cargo-target" >> "$GITHUB_ENV"

      - name: Install AgentTab workspace dependencies
        run: bun install --frozen-lockfile

      - name: Validate AgentTab sources
        run: |
          python3 -m pip install jsonschema==4.25.1
          bun run workspace:typecheck
          bun run workspace:test
          bun run workspace:build
          bun run extension:build
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/sdk-python python3 -m unittest discover -s packages/sdk-python/tests -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/test_prepare_ci_cache.py scripts/test_background_reliability.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts.test_package_host_archive scripts.test_package_artifact_manifest scripts.test_verify_release_asset_set
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/background_reliability.py scripts/package_extension_store.py tests/architecture/verify_identity.py tests/architecture/verify_permissions.py tests/architecture/verify_protocol_schemas.py tests/architecture/verify_forbidden_surface.py
          node --check packages/extension/dist/background.js
          node --check packages/extension/dist/wake.js
          node --check packages/extension/dist/popup.js

      - name: Run architecture and runtime gates
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tests/architecture/verify_permissions.py
          cargo test --locked --manifest-path tests/architecture/ipc-probe/Cargo.toml
          PYTHONDONTWRITEBYTECODE=1 python3 tests/architecture/verify_protocol_schemas.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/architecture/verify_identity.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/architecture/verify_forbidden_surface.py
          cargo fmt --all --manifest-path host-rs/Cargo.toml -- --check
          cargo test --workspace --locked --manifest-path host-rs/Cargo.toml
          cargo build --release --locked --manifest-path host-rs/Cargo.toml -p agenttab-host

      - name: Enforce persistent M1 cache bounds
        if: ${{ always() && startsWith(runner.name, 'wolfie-m1') }}
        shell: bash
        run: |
          python3 scripts/prepare_ci_cache.py \
            --root "$HOME/Library/Caches/agenttab-ci/rust-1.97"

  adapters-portability:
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.lane == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install AgentTab workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify adapters and transactional installer
        run: |
          bun run workspace:typecheck
          bun run --cwd packages/sdk-typescript test
          bun run --cwd packages/mcp test
          bun run --cwd packages/omp test
          bun run --cwd packages/installer test
          bun run workspace:build
          python -m unittest discover -s packages/sdk-python/tests -v
      - name: Verify browser extension on Unix
        if: ${{ runner.os != 'Windows' }}
        run: bun run --cwd packages/extension test

  ipc-linux:
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Linux IPC primitives
        run: cargo test --locked --manifest-path tests/architecture/ipc-probe/Cargo.toml
      - name: Test the AgentTab runtime core on Linux
        run: cargo test --workspace --locked --manifest-path host-rs/Cargo.toml

  ipc-windows:
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.lane == 'full' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Windows IPC primitives
        run: cargo test --locked --manifest-path tests/architecture/ipc-probe/Cargo.toml
      - name: Test the AgentTab runtime core on Windows
        run: cargo test --workspace --locked --manifest-path host-rs/Cargo.toml

  verify:
    name: verify
    if: always()
    needs:
      - classify
      - ci-policy
      - ci
      - adapters-portability
      - ipc-linux
      - ipc-windows
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      LANE: ${{ needs.classify.outputs.lane }}
      POLICY_RESULT: ${{ needs.ci-policy.result }}
      CI_RESULT: ${{ needs.ci.result }}
      ADAPTERS_RESULT: ${{ needs.adapters-portability.result }}
      IPC_LINUX_RESULT: ${{ needs.ipc-linux.result }}
      IPC_WINDOWS_RESULT: ${{ needs.ipc-windows.result }}
    steps:
      - name: Require the selected verification lane
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY_RESULT" != success ]]; then
            echo "::error::CI classification did not succeed"
            exit 1
          fi
          case "$LANE" in
            fast)
              for result in \
                "$POLICY_RESULT" \
                "$CI_RESULT" \
                "$ADAPTERS_RESULT" \
                "$IPC_LINUX_RESULT" \
                "$IPC_WINDOWS_RESULT"
              do
                if [[ "$result" != skipped ]]; then
                  echo "::error::Fast-lane job unexpectedly resolved to $result"
                  exit 1
                fi
              done
              echo "Fast-lane classification and public-text scan succeeded"
              ;;
            full)
              for result in \
                "$POLICY_RESULT" \
                "$CI_RESULT" \
                "$ADAPTERS_RESULT" \
                "$IPC_LINUX_RESULT" \
                "$IPC_WINDOWS_RESULT"
              do
                if [[ "$result" != success ]]; then
                  echo "::error::Required full-lane job resolved to $result"
                  exit 1
                fi
              done
              echo "Full verification lane succeeded"
              ;;
            *)
              echo "::error::Unknown CI verification lane: ${LANE:-unset}"
              exit 1
              ;;
          esac
