name: CI

on:
  pull_request:
    branches: [main, pivot/agenttab]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.M1_CI_ENABLED == 'true' && '["self-hosted","macOS","ARM64","wolfie-m1","trusted"]' || '"macos-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        if: ${{ runner.name != 'wolfie-m1-chrome-bridge' }}
        with:
          python-version: '3.11'
      - name: Use the provisioned M1 Python
        if: ${{ runner.name == 'wolfie-m1-chrome-bridge' }}
        shell: bash
        run: |
          python_root=/opt/homebrew/opt/python@3.11/libexec/bin
          "$python_root/python3" --version
          echo "$python_root" >> "$GITHUB_PATH"
          cft_binary="$(find "$HOME/Library/Caches/ms-playwright" \
            -path '*Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing' \
            -type f -print -quit)"
          test -n "$cft_binary"
          "$cft_binary" --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare persistent M1 build cache
        if: ${{ startsWith(runner.name, 'wolfie-m1') }}
        shell: bash
        run: |
          cache_root="$HOME/Library/Caches/agenttab-ci/rust-1.97"
          python3 scripts/prepare_ci_cache.py --root "$cache_root"
          echo "CARGO_TARGET_DIR=$cache_root/cargo-target" >> "$GITHUB_ENV"

      - name: Install AgentTab workspace dependencies
        run: bun install --frozen-lockfile

      - name: Validate AgentTab sources
        run: |
          python3 -m pip install jsonschema==4.25.1
          bun run workspace:typecheck
          bun run workspace:test
          bun run workspace:build
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/sdk-python python3 -m unittest discover -s packages/sdk-python/tests -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/test_prepare_ci_cache.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts.test_package_host_archive scripts.test_package_artifact_manifest scripts.test_verify_release_asset_set
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile scripts/background_reliability.py scripts/package_extension_store.py tests/architecture/verify_identity.py tests/architecture/verify_permissions.py tests/architecture/verify_protocol_schemas.py tests/architecture/verify_forbidden_surface.py
          node --check background.js
          node --check wake.js
          node --check popup.js
          diff -q manifest.json extension/manifest.json
          diff -q background.js extension/background.js
          diff -q wake.html extension/wake.html
          diff -q wake.js extension/wake.js
          diff -q popup.html extension/popup.html
          diff -q popup.css extension/popup.css
          diff -q popup.js extension/popup.js
          diff -qr icons extension/icons

      - name: Run architecture and runtime gates
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tests/architecture/verify_permissions.py
          cargo test --locked --manifest-path tests/architecture/ipc-probe/Cargo.toml
          PYTHONDONTWRITEBYTECODE=1 python3 tests/architecture/verify_protocol_schemas.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/architecture/verify_identity.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/architecture/verify_forbidden_surface.py
          cargo fmt --all --manifest-path host-rs/Cargo.toml -- --check
          cargo test --workspace --locked --manifest-path host-rs/Cargo.toml
          cargo build --release --locked --manifest-path host-rs/Cargo.toml -p agenttab-host

      - name: Enforce persistent M1 cache bounds
        if: ${{ always() && startsWith(runner.name, 'wolfie-m1') }}
        shell: bash
        run: |
          python3 scripts/prepare_ci_cache.py \
            --root "$HOME/Library/Caches/agenttab-ci/rust-1.97"

  adapters-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install AgentTab workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify adapters and transactional installer
        run: |
          bun run workspace:typecheck
          bun run --cwd packages/sdk-typescript test
          bun run --cwd packages/mcp test
          bun run --cwd packages/omp test
          bun run --cwd packages/installer test
          bun run workspace:build
          python -m unittest discover -s packages/sdk-python/tests -v
      - name: Verify browser extension on Unix
        if: ${{ runner.os != 'Windows' }}
        run: bun run --cwd packages/extension test

  ipc-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Linux IPC primitives
        run: cargo test --locked --manifest-path tests/architecture/ipc-probe/Cargo.toml
      - name: Test the AgentTab runtime core on Linux
        run: cargo test --workspace --locked --manifest-path host-rs/Cargo.toml

  ipc-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Windows IPC primitives
        run: cargo test --locked --manifest-path tests/architecture/ipc-probe/Cargo.toml
      - name: Test the AgentTab runtime core on Windows
        run: cargo test --workspace --locked --manifest-path host-rs/Cargo.toml
